# ==============================================================================
# Render Infrastructure Blueprint Configuration (render.yaml)
#
# This blueprint defines the deployment specification for hosting the complete
# Animal Kingdom Knowledge Graph full-stack application on Render (render.com):
#
# 1. animal-kingdom-backend (Python Web Service):
#    Runs the FastAPI backend server using Uvicorn, connecting to Neo4j Aura.
#
# 2. animal-kingdom-frontend (Static Site):
#    Compiles and hosts the React + Vite frontend with single-page app (SPA) rewrites.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: animal-kingdom-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      # The following Neo4j credentials must be configured in Render Dashboard
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false

  # ----------------------------------------------------------------------------
  # 2. React Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: animal-kingdom-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Client-side SPA routing rewrite rule: routes all subpaths to /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set to your deployed backend URL (e.g. https://animal-kingdom-backend.onrender.com)
      - key: VITE_API_URL
        sync: false
